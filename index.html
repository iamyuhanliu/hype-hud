<style>
:root{--bg:#000;--card:rgba(27,24,38,.80);--vio:#b9a6ff;--vio-hi:#e9e3ff;--ink:#f5f5f7;--mute:#aeaeb6;--line:rgba(226,216,255,.14);--accent:#f5f5f7;--accent-soft:rgba(255,255,255,.1);

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}

a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:3px}a:hover{text-decoration-color:#fff}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.55);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}

.card.key2 .note,.card.key2 .cmp td.usual,.card.key2 th{color:#cfc9e2}

.card.key .ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26)}

.fk.watch{background:rgba(240,170,60,.16);border-color:rgba(240,170,60,.6)}.fk.watch>i{background:var(--hesitant)}

.tabs button:hover{color:var(--ink)}.tabs button.on{background:var(--vio-hi);color:#14101f}
.top nav a.on{color:var(--vio-hi)}
.note{font-size:13px;color:var(--mute);margin-top:12px}

.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:820px){.qs{grid-template-columns:1fr}}

async function runBatch() {

    while (!B.stop && next < queue.length) {
      const it = queue[next++]; it.status = 'running'; renderBatch();
      try { await analyseOne('https://www.youtube.com/watch?v=' + it.id); it.status = 'done'; applyFee(it); }
      catch (e) { it.status = 'error'; it.err = e && e.code ? e.code : 'network'; if (['user_limit', 'daily_limit', 'need_password', 'bad_password', 'not_configured'].includes(it.err)) { B.stop = true; queue.slice(next).forEach(x => { x.status = 'error'; x.err = it.err; }); next = queue.length; } }

/* 背景：像素抖动的流动纹理 */
(function () {
